// The boss difficulty dialog's payload, named from TBossDifficultySelectionDialogController. Its ten properties cover the numeric fields cleanly; the five trailing string fields are less certain because the wrapper lists only three string-ish properties.
// area: bosstiary
message BossDifficultySelectionDetailed {
  optional uint32 race_id = 1;                            // inferred/med
  optional bool is_active_user = 2;                       // inferred/med
  optional uint32 lowest_difficulty = 3;                  // inferred/med
  optional uint32 personal_highest_difficulty = 4;        // inferred/med
  optional uint32 highest_difficulty_of_group = 5;        // inferred/med
  optional uint32 selected_difficulty = 6;                // inferred/med
  optional float current_bad_luck_drop_bonus = 7;         // inferred/med; the only float, and the only fractional property in the wrapper
  optional bytes field8 = 8;                              // UNRESOLVED
  optional bytes field9 = 9;                              // UNRESOLVED
  optional bytes field10 = 10;                            // UNRESOLVED
  optional bytes field11 = 11;                            // UNRESOLVED
  optional bytes field12 = 12;                            // UNRESOLVED; five string fields against playerNames, conModifiers and proModifiers - not enough to place them
}

// An incremental update to the open boss difficulty dialog.
// area: bosstiary
message BossDifficultySelectionUpdate {
  optional uint32 field1 = 1;                             // UNRESOLVED
  repeated bytes field2 = 2;                              // UNRESOLVED
  repeated bytes field3 = 3;                              // UNRESOLVED
}

// One boss in the shipped static-data bundle, 447 of them.
// area: staticdata
message BossMonster {
  optional uint32 boss_id = 1;                            // inferred/high; 447 distinct, 46..2855 - looks like a race id but is not one: zero of the 447 values appears among the 833 monster race_ids, so bosses are numbered in their own space
  optional bytes name = 2;                                // inferred/high; text
  optional Outfit outfit = 3;                             // inferred/high
  optional bool field4 = 4;                               // UNRESOLVED; true for exactly 14 bosses: Devovorga, Zushuka, The Pale Count, Ascending Ferumbras, The Enraged Thorn Knight, The Souldespoiler, Ancient Spawn Of Morgathla, Izcandar Champion of Summer, Izcandar Champion of Winter, Alptramun, The Percht Queen, Scarlett Etzel, Urmahlullu the Weakened, Goshnar's Megalomania. What that set has in common is a question for someone who knows the game; the data alone does not say.
}

// One configured boss slot. tibia::gamewindow::TBossSlotQMLInformation declares raceID, name, unlocked, numberOfKills, currentLootBonus, killBonus, priceForReset, resetPriceNumber, bossRaritySource, bossRarityTooltip, killsForProwess, killsForExpertise, killsForMastery, unlockBosspoints and isInBoostedSlot. Most of those do not come from this message: raceID, name and rarity ride on the BosstiaryBossDetail in field 2, the two tooltip and image-source strings are composed client side, priceForReset is resetPriceNumber formatted, and the three rank thresholds are fixed per rarity rather than per slot. What is left is exactly four numbers and one flag, against this message's four remaining uint32 fields and one remaining bool.
// area: bosstiary
message BossSlotData {
  optional bool is_set = 1;                               // inferred/med
  optional BosstiaryBossDetail boss = 2;                  // inferred/high
  optional uint32 kills = 3;                              // inferred/low
  optional uint32 current_loot_bonus = 4;                 // inferred/med
  optional uint32 kill_bonus = 5;                         // inferred/med
  optional BOSS_UNLOCK_GRADE unlock_grade = 6;            // inferred/med
  optional uint32 reset_price = 7;                        // inferred/med
  optional bool is_in_boosted_slot = 8;                   // inferred/med
  optional uint32 unlock_bosspoints = 9;                  // inferred/med
}

// One boss on the tracker.
// area: bosstiary
message BossTrackingEntry {
  optional uint32 race_id = 1;                            // inferred/med
  optional uint64 cooldown_until = 2;                     // inferred/low
}

// A boss and its rarity. Fields 2 and 3 are absent.
// area: bosstiary
message BosstiaryBossDetail {
  optional uint32 race_id = 1;                            // inferred/med
  optional BOSS_RARITY rarity = 4;                        // inferred/high
}

// Points granted at each unlock grade. Three of these are sent, one per BOSS_RARITY.
// area: bosstiary
message BosstiaryBossPointsGranted {
  optional uint32 prowess = 1;                            // inferred/med
  optional uint32 expertise = 2;                          // inferred/med
  optional uint32 mastery = 3;                            // inferred/med
}

// One boss in the bosstiary, with kill count and unlock grade.
// area: bosstiary
