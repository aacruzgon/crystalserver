// ============================================================================
// Messages
// ============================================================================

// One achievement in the static-data bundle, confirmed against the shipped file.
// area: staticdata
message Achievement {
  optional uint32 achievement_id = 1;                     // inferred/high
  optional bytes name = 2;                                // inferred/high; text
  optional bytes description = 3;                         // inferred/high; text
  optional uint32 grade = 4;                              // inferred/high; only ever 1, 2 or 3 across all 368 achievements
}

// One achievement; TQmlAchievement declares name, description, grade, secret and unlockDateString, which fixes fields 2, 3 and 6.
// area: cyclopedia
message AchievementData {
  optional uint32 achievement_id = 1;                     // inferred/med
  optional uint32 grade = 2;                              // inferred/high; QML grade
  optional bool secret = 3;                               // inferred/high; QML secret
  optional bytes name = 4;                                // inferred/high; text
  optional bytes description = 5;                         // inferred/high; text
  optional uint32 unlock_timestamp = 6;                   // inferred/med; QML unlockDateString; the earlier reading of this as an achievement-points value was wrong - TQmlAchievement has no points property
}

// A character stat broken down by source, but with 3 doubles rather than STAT_SOURCE's five, so the per-source mapping does not follow and the fields are left unresolved.
// area: cyclopedia
message AmplificationStats {
  optional double field1 = 1;                             // UNRESOLVED
  optional double field2 = 2;                             // UNRESOLVED
  optional double field3 = 3;                             // UNRESOLVED
}

// One drawable thing: an appearance (object type) id, plus an ExtensionSet naming what kind of thing it is. Ids 97..99 mean the instance is a creature and carry a CreatureData extension - the client checks exactly that range before attaching it.
// area: map
message AppearanceInstance {
  optional uint32 appearance_id = 1;                      // inferred/high
  extensions 100 to 112;
}

// An object type and how many of it.
// area: containers
message AppearanceTypeAndCount {
  optional uint32 object_type_id = 1;                     // inferred/high
  optional uint32 count = 2;                              // inferred/high
}

// An object type together with its forge tier - the market prices tiers separately.
// area: market
message AppearanceTypeUpgradeable {
  optional uint32 object_type_id = 1;                     // inferred/high
  optional uint32 tier = 2;                               // inferred/med
}

// The armor value on the defence page. A single scalar, unlike the five-source stats around it.
// area: cyclopedia
message ArmorValueStats {
  optional uint32 total = 1;                              // inferred/med
}

// The attack line of the offence page: the attack value, the weapon skill it derives from, and the damage element. Field 6 is absent.
// area: cyclopedia
message AttackStats {
  optional uint32 field1 = 1;                             // UNRESOLVED
  optional uint32 field2 = 2;                             // UNRESOLVED
  optional uint32 field3 = 3;                             // UNRESOLVED
  optional CHARACTERINFO_SKILLTYPE skill_type = 4;        // inferred/high
  optional int32 field5 = 5;                              // UNRESOLVED
  optional int32 field7 = 7;                              // UNRESOLVED
  optional TYPE element = 8;                              // inferred/high
}

// One outfit, mount or summon skin in the outfit window.
// area: outfits
message AvailableOutfitData {
  optional uint32 look_type = 1;                          // inferred/high
  optional bytes name = 2;                                // inferred/high; text
  optional OUTFIT_TYPE availability = 3;                  // inferred/med
  optional uint32 field4 = 4;                             // UNRESOLVED
  optional OUTFIT_PART part = 5;                          // inferred/med
  optional uint32 field6 = 6;                             // UNRESOLVED
}

// Rolling average price used to value inventory.
// area: market
message AverageMarketPrice {
  optional uint32 object_type_id = 1;                     // inferred/high
  optional uint64 average_price = 2;                      // inferred/med
  optional uint32 tier = 3;                               // inferred/low
}

// One tracked bestiary or bosstiary race and its kill progress.
// area: bosstiary
message BestiaryTrackerEntry {
  optional uint32 race_id = 1;                            // inferred/high
  optional uint32 kills = 2;                              // inferred/med
  optional uint32 first_threshold = 3;                    // inferred/low
  optional uint32 second_threshold = 4;                   // inferred/low
  optional uint32 third_threshold = 5;                    // inferred/low
  optional bool completed = 6;                            // inferred/low
}

// How many of one blessing the character has.
// area: dailyreward
message BlessingCount {
  optional BLESSING blessing = 1;                         // inferred/high
  optional uint32 count = 2;                              // inferred/med
  optional uint32 field3 = 3;                             // UNRESOLVED
}

// One line of the blessing history.
// area: dailyreward
